# CI Workflow for repo_updater (ru)
# Runs on every push and PR to main
#
# Security: Uses minimal permissions and pinned action versions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions - read-only access to repository contents
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
          additional_files: 'ru install.sh'

  syntax:
    name: Bash Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check ru syntax
        run: bash -n ru

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: Check test scripts syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

  tests:
    name: Test Suite (${{ matrix.os }})
    needs: [shellcheck, syntax]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Homebrew cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/bash
            /opt/homebrew/Cellar/bash
          key: ${{ runner.os }}-homebrew-bash-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-bash-

      - name: Install bash 5 (macOS)
        if: runner.os == 'macOS'
        run: |
          # Update brew and handle any stale cache issues
          brew update || true

          # Uninstall if present to avoid cache conflicts, then install fresh
          brew uninstall --ignore-dependencies bash 2>/dev/null || true
          brew install bash

          # Link bash to ensure it's available in PATH (may already be linked)
          brew link --overwrite bash 2>/dev/null || true

          # Find the bash 5 binary - use formula prefix which is architecture-aware
          BASH_5="$(brew --prefix bash)/bin/bash"
          if [[ ! -x "$BASH_5" ]]; then
            # Fallback to Homebrew prefix
            BASH_5="$(brew --prefix)/bin/bash"
          fi
          if [[ ! -x "$BASH_5" ]]; then
            # Last resort: search in Cellar
            CELLAR="$(brew --cellar bash)"
            BASH_5="$(ls -1 "$CELLAR"/*/bin/bash 2>/dev/null | tail -1)"
          fi

          if [[ -x "$BASH_5" ]]; then
            echo "Found bash at: $BASH_5"
            "$BASH_5" --version | head -1
            echo "BASH_5=$BASH_5" >> $GITHUB_ENV
            # Prepend to PATH so it takes precedence
            echo "$(dirname "$BASH_5")" >> $GITHUB_PATH
          else
            echo "::error::Unable to locate Homebrew bash"
            exit 1
          fi

      - name: Show bash version
        if: runner.os == 'macOS'
        run: |
          echo "PATH: $PATH"
          echo "BASH_5: $BASH_5"
          "$BASH_5" --version | head -1

      - name: Install conformance test dependencies
        run: |
          if [[ "$(uname -s)" == Darwin ]]; then
            brew install jq tmux
          else
            sudo apt-get update
            sudo apt-get install -y jq tmux
          fi
          python3 -m venv "$RUNNER_TEMP/ru-schema-venv"
          "$RUNNER_TEMP/ru-schema-venv/bin/python" -m pip install \
            --disable-pip-version-check 'jsonschema==4.19.2' 'rfc3339-validator==0.1.4'
          echo "$RUNNER_TEMP/ru-schema-venv/bin" >> "$GITHUB_PATH"

      - name: Install verified TOON encoder for actual round trips
        run: |
          # Pin the encoder version used by the conformance probes. These
          # SHA256 digests are the published v0.1.1 release asset digests.
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) target=linux-amd64; digest=a155e50383ca8388d3e84615776a70deb7ef6415f775879253cbcba6548dd5c9 ;;
            Linux/aarch64) target=linux-arm64; digest=ff7b25b10358ad96eaa204632b746033a014cffb8b71352132e9768678457acf ;;
            Darwin/x86_64) target=darwin-amd64; digest=12733939163d71ef321da2cd9924eb994d51d3000200415d3370f8a194b6c7b6 ;;
            Darwin/arm64) target=darwin-arm64; digest=047394c0457e6a134bb1e953c91e39d1e4ec85996a8ddc9924332fce525d9d6c ;;
            *) echo "Unsupported TOON test platform" >&2; exit 1 ;;
          esac
          tools_dir="$RUNNER_TEMP/ru-toon-tools"
          mkdir -p "$tools_dir"
          archive="$tools_dir/tru-$target.tar.xz"
          curl -fL --retry 2 \
            "https://github.com/Dicklesworthstone/toon_rust/releases/download/v0.1.1/tru-$target.tar.xz" \
            -o "$archive"
          python3 - "$archive" "$digest" <<'PY'
          import hashlib, pathlib, sys
          actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != sys.argv[2]:
              raise SystemExit("TOON test archive SHA256 mismatch")
          PY
          tar -xJf "$archive" -C "$tools_dir"
          test -x "$tools_dir/tru"
          "$tools_dir/tru" --version
          echo "$tools_dir" >> "$GITHUB_PATH"
          # A test adapter invokes the real encoder. No personal toon.sh
          # installation or synthetic encoded responses are required in CI.
          cat > "$tools_dir/toon.sh" <<'BASH'
          toon_available() { command -v tru >/dev/null 2>&1; }
          toon_encode() {
              local -a args=(--encode)
              [[ -z "${TOON_STATS:-}" ]] || args+=(--stats)
              [[ -z "${TOON_INDENT:-}" ]] || args+=(--indent "$TOON_INDENT")
              [[ "${TOON_KEY_FOLDING:-}" != safe ]] || args+=(--key-folding safe)
              tru "${args[@]}"
          }
          BASH
          echo "TOON_SH_PATH=$tools_dir/toon.sh" >> "$GITHUB_ENV"

      - name: Create test output directory
        run: mkdir -p test-results

      - name: Run all tests (TAP format)
        id: tap_tests
        run: |
          if [[ "$(uname)" == "Darwin" ]]; then
            "$BASH_5" ./scripts/run_all_tests.sh --tap 2>&1 | tee test-results/tests.tap
          else
            ./scripts/run_all_tests.sh --tap 2>&1 | tee test-results/tests.tap
          fi

      - name: Run all tests (human-readable)
        if: failure() || success()
        run: |
          if [[ "$(uname)" == "Darwin" ]]; then
            "$BASH_5" ./scripts/run_all_tests.sh 2>&1 | tee test-results/tests.log
          else
            ./scripts/run_all_tests.sh 2>&1 | tee test-results/tests.log
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 14

  install-test:
    name: Installation Test
    needs: [shellcheck, syntax]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Homebrew cache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/bash
            /opt/homebrew/Cellar/bash
          key: ${{ runner.os }}-homebrew-bash-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-bash-

      - name: Install bash 5 (macOS)
        if: runner.os == 'macOS'
        run: |
          # Update brew and handle any stale cache issues
          brew update || true

          # Uninstall if present to avoid cache conflicts, then install fresh
          brew uninstall --ignore-dependencies bash 2>/dev/null || true
          brew install bash

          # Link bash to ensure it's available in PATH (may already be linked)
          brew link --overwrite bash 2>/dev/null || true

          # Find the bash 5 binary - use formula prefix which is architecture-aware
          BASH_5="$(brew --prefix bash)/bin/bash"
          if [[ ! -x "$BASH_5" ]]; then
            # Fallback to Homebrew prefix
            BASH_5="$(brew --prefix)/bin/bash"
          fi
          if [[ ! -x "$BASH_5" ]]; then
            # Last resort: search in Cellar
            CELLAR="$(brew --cellar bash)"
            BASH_5="$(ls -1 "$CELLAR"/*/bin/bash 2>/dev/null | tail -1)"
          fi

          if [[ -x "$BASH_5" ]]; then
            echo "Found bash at: $BASH_5"
            "$BASH_5" --version | head -1
            echo "BASH_5=$BASH_5" >> $GITHUB_ENV
            # Prepend to PATH so it takes precedence
            echo "$(dirname "$BASH_5")" >> $GITHUB_PATH
          else
            echo "::error::Unable to locate Homebrew bash"
            exit 1
          fi

      - name: Run installer
        run: |
          chmod +x install.sh
          # Use RU_UNSAFE_MAIN=1 to test main-branch install path
          # (avoids dependency on GitHub releases existing)
          RU_UNSAFE_MAIN=1 DEST=/tmp/ru-test ./install.sh

      - name: Verify installation
        run: |
          test -x /tmp/ru-test/ru
          echo "ru is installed and executable"

      - name: Check version output
        run: |
          # Use brew bash on macOS since ru requires bash >= 4.3
          if [[ "$(uname)" == "Darwin" ]]; then
            "$BASH_5" /tmp/ru-test/ru --version
          else
            /tmp/ru-test/ru --version
          fi

      - name: Check help output
        run: |
          if [[ "$(uname)" == "Darwin" ]]; then
            "$BASH_5" /tmp/ru-test/ru --help | head -20
          else
            /tmp/ru-test/ru --help | head -20
          fi

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check VERSION file exists
        run: |
          if [[ ! -f VERSION ]]; then
            echo "::warning::VERSION file not found"
            exit 0
          fi

      - name: Verify version matches
        run: |
          if [[ ! -f VERSION ]]; then
            exit 0
          fi

          file_version=$(cat VERSION)
          script_version=$(grep -m1 'VERSION=' ru | cut -d'"' -f2)

          if [[ "$file_version" != "$script_version" ]]; then
            echo "::error::VERSION file ($file_version) does not match ru script ($script_version)"
            exit 1
          fi

          echo "Versions are consistent: $file_version"
